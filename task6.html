    <img src="assets/Untitled.png" class="image">
    <a id="link" href="https://youtube.com">Youtube.com</a>
    <button>change</button>
    <script>
        const links = [
            {link: "https://youtube.com", text:"Youtube.com"},
            {link: "https://github.com", text:"Github.com"}
        ]
        const images =
        [
            {"src": "assets/Untitled.png"},
            {"src": "assets/Untitled1.png"}
        ]
        let imgIndex = 0;
        let linkIndex = 0;
        $("button").on("click",()=>{
            imgIndex = (imgIndex+1) % images.length;
            linkIndex = (linkIndex+1) % links.length;
            $("img").attr({src: images[imgIndex].src})

            $("#link").attr({href: links[linkIndex].link})
            $("#link").text(links[linkIndex].text)
        })
    </script>
