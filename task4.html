    <h2>Collapsible Panel</h2>

    <div class="controls">
        <button id="up">Slide Up</button>
        <button id="down">Slide Down</button>
        <button id="toggle">Slide Toggle</button>
    </div>

    <div id="panel">
        <h3>Panel title</h3>
        <p>This content slides up and down. jQuery animates the height of the panel
            to collapse or expand it.</p>
    </div>

    <script>
        $("#up").on("click", () => {
            $("#panel").slideUp(400);
        });

        $("#down").on("click", () => {
            $("#panel").slideDown(400);
        });

        $("#toggle").on("click", () => {
            $("#panel").slideToggle(400);
        });
    </script>
