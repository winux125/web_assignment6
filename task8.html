    <h2>Basic Animation</h2>

    <div class="controls">
        <button id="animate">Animate</button>
        <button id="reset">Reset</button>
    </div>

    <div id="stage">
        <div id="square"></div>
    </div>

    <script>
        $("#animate").on("click", () => {
            $("#square").stop(true).animate({
                width: "160px",
                height: "160px",
                left: "300px",
                top: "100px"
            }, 800);
        });

        $("#reset").on("click", () => {
            $("#square").stop(true).animate({
                width: "80px",
                height: "80px",
                left: "0px",
                top: "0px"
            }, 800);
        });
    </script>
