    <h2>Add &amp; Remove Elements</h2>

    <div class="controls">
        <button id="add">Add Item</button>
        <button id="prepend">Add to Top</button>
        <button id="remove">Remove Item</button>
    </div>

    <ul id="item-list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <script>
        let count = 3;

        $("#add").on("click", () => {
            count++;
            $("#item-list").append(`<li>Item ${count}</li>`);
        });

        $("#prepend").on("click", () => {
            count++;
            $("#item-list").prepend(`<li>Item ${count}</li>`);
        });

        $("#remove").on("click", () => {
            $("#item-list li").last().remove();
        });
    </script>
