    <h2>Sequential Animations</h2>

    <div class="controls">
        <button id="start">Start</button>
    </div>

    <div id="stage">
        <div id="box"></div>
    </div>

    <script>
        $("#start").on("click", function () {
            const $btn = $(this);
            $btn.prop("disabled", true);

            $("#box")
                .animate({ left: "300px" }, 700)
                .animate({ top: "150px" }, 700)
                .animate({ width: "40px", height: "40px" }, 700)
                .animate(
                    { left: "0px", top: "0px", width: "100px", height: "100px" },
                    900,
                    () => $btn.prop("disabled", false)
                );
        });
    </script>
